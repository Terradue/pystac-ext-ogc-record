site_name: OGC Records PySTAC extension
site_description: OGC API Records metadata and serialization with PySTAC.
site_url: https://terradue.github.io/pystac-ext-ogc-record/
repo_url: https://github.com/Terradue/pystac-ext-ogc-record
repo_name: pystac-ext-ogc-record
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First steps: tutorials/first-steps.md
      - Create a workflow record: tutorials/workflow-record.md
  - How-to guides:
      - Overview: how-to/index.md
      - Install: how-to/install.md
      - Work with record metadata: how-to/use-extension.md
      - Workflow and experiment records: how-to/ogc-records.md
  - Reference:
      - Overview: reference/index.md
      - Record fields: reference/fields.md
      - OGC Records: reference/ogc-records.md
      - Python API: reference/api.md
  - Explanation:
      - Overview: explanation/index.md
      - Architecture: explanation/architecture.md

theme:
  name: readthedocs
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
